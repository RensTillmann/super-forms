name: Verify

run-name: "Verify · #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: JSHint (no new errors)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -E '\.js$' | grep -v '\.min\.js$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No JS files changed"
            exit 0
          fi
          echo "Changed JS files:"
          echo "$CHANGED"
          FAIL=0
          while IFS= read -r FILE; do
            SAFE="${FILE//\//_}"
            SAFE="${SAFE////_}"
            TMP="/tmp/head_${SAFE}"
            cp "$FILE" "$TMP"
            if git show "${BASE}:${FILE}" > "$FILE" 2>/dev/null; then
              BASE_ERRORS=$(node_modules/.bin/jshint "$FILE" 2>&1 | grep -c ": line" || true)
            else
              BASE_ERRORS=0
            fi
            cp "$TMP" "$FILE"
            HEAD_ERRORS=$(node_modules/.bin/jshint "$FILE" 2>&1 | grep -c ": line" || true)
            echo "$FILE: base=$BASE_ERRORS head=$HEAD_ERRORS"
            if [ "$HEAD_ERRORS" -gt "$BASE_ERRORS" ]; then
              echo "FAIL: $FILE introduced $((HEAD_ERRORS - BASE_ERRORS)) new jshint error(s):"
              node_modules/.bin/jshint "$FILE" 2>&1
              FAIL=1
            fi
          done <<< "$CHANGED"
          exit $FAIL
      - name: Configure git identity for build
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
      - name: Production build
        run: npm run prod

  phplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
      - name: Validate composer.json
        run: composer validate
      - name: PHP syntax check (src/)
        run: |
          set -eo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "All src/**/*.php files passed syntax check"
