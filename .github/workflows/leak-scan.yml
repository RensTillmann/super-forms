# .github/workflows/leak-scan.yml
#
# Public super-forms repo: detect prohibited internal vocabulary in PRs
# that touch customer-facing release text (plugin under src/ on the 6.4 line).
#
# Runtime: `.github/scripts/leak-scan.cjs`, generated from the private
# operator-side prohibited-language pattern catalogue (same file as on
# `stable`).
#
# Default: BLOCKER hits fail the job. WARN-severity patterns are intentionally
# not surfaced in this fail-closed public CI gate.

name: leak-scan

on:
  pull_request:
    paths:
      - 'src/readme.txt'
      - 'src/changelog.txt'
      - 'docs/changelog.md'
      - 'src/docs/changelog.md'
      - 'src/add-ons/*/changelog.txt'
      - 'release-notes/**'
      - '.github/workflows/leak-scan.yml'
      - '.github/scripts/leak-scan.cjs'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the scanner
        run: |
          set -uo pipefail
          printf 'Fixed: a required field could be skipped.\n' > /tmp/leak-scan-clean.txt
          node .github/scripts/leak-scan.cjs /tmp/leak-scan-clean.txt --audience release_body || { echo "::error::scanner flagged clean text"; exit 1; }
          printf 'Built from the lts/6.3.x branch.\n' > /tmp/leak-scan-dirty.txt
          node .github/scripts/leak-scan.cjs /tmp/leak-scan-dirty.txt --audience release_body
          rc=$?
          if [[ "$rc" -ne 1 ]]; then
            echo "::error::scanner did not flag a known prohibited token (exit $rc, expected 1)"
            exit 1
          fi

      - name: List candidate files changed by this PR
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" HEAD)
          git diff --name-only --diff-filter=d "${BASE_SHA}" HEAD \
            | grep -E '^(src/readme\.txt|src/changelog\.txt|docs/changelog\.md|src/docs/changelog\.md|src/add-ons/[^/]+/changelog\.txt|release-notes/)' \
            > /tmp/candidates.txt || true
          echo "candidate files:"
          cat /tmp/candidates.txt || true

      - name: Scan each candidate for prohibited language (release_body audience)
        run: |
          set -uo pipefail
          if [[ ! -s /tmp/candidates.txt ]]; then
            echo "No candidate files changed; nothing to scan."
            exit 0
          fi
          fail=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if ! node .github/scripts/leak-scan.cjs "$f" --audience release_body; then
              fail=1
            fi
          done < /tmp/candidates.txt
          exit "$fail"
